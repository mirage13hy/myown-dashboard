<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>나만의 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- GitHub Pages용 경량 잠금 화면 (최초 1회 7777 입력 후 30일 유지) -->
  <div id="pinGate" class="pin-gate hidden">
    <form id="pinForm" class="pin-card">
      <h2>MyOwn 대시보드</h2>
      <p>접속 비밀번호를 입력하세요.</p>
      <div id="pinError" class="pin-err hidden">비밀번호가 올바르지 않습니다.</div>
      <input id="pinInput" type="password" inputmode="numeric" placeholder="비밀번호" required />
      <button type="submit">입장하기</button>
    </form>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="./" class="brand-title" id="brandHome">MyOwn 대시보드</a>
        <span class="updated-at" id="updatedAt">불러오는 중...</span>
      </div>
      <nav class="tabs" id="mainTabs" role="tablist">
        <button class="tab-btn active" data-tab="hot" role="tab" aria-selected="true">화제글</button>
        <button class="tab-btn" data-tab="ai" role="tab" aria-selected="false">AI</button>
        <button class="tab-btn" data-tab="deals" role="tab" aria-selected="false">핫딜</button>
        <button class="tab-btn" data-tab="games" role="tab" aria-selected="false">게임</button>
        <button class="tab-btn" data-tab="reddit" role="tab" aria-selected="false">레딧</button>
        <button class="tab-btn" data-tab="economy" role="tab" aria-selected="false">경제·유튜브</button>
        <button class="tab-btn" data-tab="scraps" role="tab" aria-selected="false">★ 스크랩</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 목록 뷰 -->
    <section id="listView" class="view">
      <!-- 탭별 필터/요약 바 -->
      <div id="filterBar" class="filter-bar"></div>

      <!-- 공동 화제 배너/섹션 (화제글 탭) -->
      <div id="crossTopicSection" class="cross-section hidden"></div>

      <!-- 경제 시황 카드 (경제 탭) -->
      <div id="marketSection" class="market-section hidden"></div>

      <!-- 게시판 글 목록 -->
      <div id="postList" class="post-list"></div>
    </section>

    <!-- 상세 원문 뷰 (일반 게시판처럼 클릭 시 전환, 뒤로가기 지원) -->
    <section id="detailView" class="view hidden" aria-live="polite">
      <div class="detail-nav">
        <button type="button" id="backBtn" class="back-btn">← 목록으로</button>
        <div class="detail-actions">
          <button type="button" id="detailStarBtn" class="star-btn">☆ 스크랩</button>
          <a id="originalLink" class="orig-link" href="#" target="_blank" rel="noopener noreferrer">원본 글 열기 ↗</a>
        </div>
      </div>
      <article id="detailContent" class="detail-card"></article>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
